# Intégration continue : tests unitaires, tests d'intégration (MongoDB en
# service), build du client, lint.
#
# Le déploiement est ailleurs (deploy.yml, flyctl). Un job « docker » qui
# poussait une image vers le registre Fly a été retiré le 5 septembre 2026 :
# il faisait double emploi et échouait à chaque poussée depuis août (secret
# d'application absent, connexion au registre refusée). Un job Snyk sans jeton,
# qui échouait en silence, a été retiré en même temps.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd client && npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run integration tests
        run: npm run test:integration

      - name: Build frontend
        run: |
          cd client
          npm run build

      # Le lint est celui du client (ESLint 9, React). Deux règles React sont
      # en avertissement, dette notée dans client/eslint.config.js.
      - name: Lint
        run: npm run lint
